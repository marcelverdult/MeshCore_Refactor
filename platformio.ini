; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs =
  variants/*/platformio.ini
  platformio.local.ini

[arduino_base]
framework = arduino
monitor_speed = 115200
lib_deps =
  SPI
  Wire
  ;jgromes/RadioLib @ ^7.7.1
  https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
  rweather/Crypto @ ^0.4.0
  adafruit/RTClib @ ^2.1.3
  melopero/Melopero RV3028 @ ^1.1.0
  electroniccats/CayenneLPP @ 1.6.1
build_flags = -w -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D ENABLE_ADVERT_ON_BOOT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1   ; NOTE: comment these out for more secure firmware
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
build_src_filter =
  +<*.cpp>
  +<helpers/*.cpp>
  +<helpers/radiolib/*.cpp>
  +<helpers/bridges/BridgeBase.cpp>
  +<helpers/ui/MomentaryButton.cpp>

; ----------------- ESP32 ---------------------

[esp32_base]
extends = arduino_base
platform = platformio/espressif32@6.11.0
monitor_filters = esp32_exception_decoder
extra_scripts = merge-bin.py
build_flags = ${arduino_base.build_flags}
  -D ESP32_PLATFORM
;  -D ESP32_CPU_FREQ=80          ; change it to your need
build_src_filter = ${arduino_base.build_src_filter}

[esp32_ota]
lib_deps =
  ESP32Async/ESPAsyncWebServer @ 3.10.3
  file://arch/esp32/AsyncElegantOTA

; esp32c6 uses arduino framework 3.x
; WARNING: experimental. May not work as stable as other platforms.
[esp32c6_base]
extends = esp32_base
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip

; ----------------- NRF52 ---------------------

[nrf52_base]
extends = arduino_base
platform = nordicnrf52
platform_packages =
  ; use internal fork that includes patch to ble stack to prevent firmware lockup during rapid connect/disconnect
  ; https://github.com/meshcore-dev/MeshCore/pull/1177
  ; https://github.com/meshcore-dev/MeshCore/pull/1295
  framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino#d541301665b40959682252911e57b11df3ee651a
  platformio/toolchain-gccarmnoneeabi@^1.140201.0
extra_scripts = create-uf2.py
build_flags = ${arduino_base.build_flags}
  -D NRF52_PLATFORM
  -D LFS_NO_ASSERT=1
  -D EXTRAFS=1
  -D USE_CC310_HW_CRYPTO=1
lib_deps =
  ${arduino_base.lib_deps}
  https://github.com/oltaco/CustomLFS#0.2.3
; ----------------- RP2040 ---------------------

[rp2040_base]
extends = arduino_base
upload_protocol = picotool
board_build.core = earlephilhower
platform = https://github.com/maxgerhardt/platform-raspberrypi.git   ; framework-arduinopico @ 1.50600.0+sha.6a1d13e9
build_flags = ${arduino_base.build_flags}
  -D RP2040_PLATFORM

; ----------------- STM32 ----------------------

[stm32_base]
extends = arduino_base
; Pinned pending upstream fix for upstream conversions.
; https://github.com/jgromes/RadioLib/issues/1873
platform = ststm32@19.7.1
extra_scripts = post:arch/stm32/build_hex.py
build_flags = ${arduino_base.build_flags}
  -D STM32_PLATFORM
  -I src/helpers/stm32
  -I $PROJECT_PACKAGES_DIR/framework-arduinoststm32/libraries/SubGhz/src
build_src_filter = ${arduino_base.build_src_filter}
  +<helpers/stm32>
lib_deps = ${arduino_base.lib_deps}
  file://arch/stm32/Adafruit_LittleFS_stm32
  SubGhz

[sensor_base]
build_flags =
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_SHTC3=1
  -D ENV_INCLUDE_SHT4X=1
  -D ENV_INCLUDE_LPS22HB=1
  -D ENV_INCLUDE_INA3221=1
  -D ENV_INCLUDE_INA219=1
  -D ENV_INCLUDE_INA226=1
  -D ENV_INCLUDE_INA260=1
  -D ENV_INCLUDE_MLX90614=1
  -D ENV_INCLUDE_VL53L0X=1
  -D ENV_INCLUDE_BME680=1
  -D ENV_INCLUDE_BMP085=1
lib_deps =
  adafruit/Adafruit INA3221 Library @ ^1.0.1
  adafruit/Adafruit INA219 @ ^1.2.3
  robtillaart/INA226 @ ^0.6.4
  adafruit/Adafruit INA260 Library @ ^1.5.3
  adafruit/Adafruit AHTX0 @ ^2.0.5
  adafruit/Adafruit BME280 Library @ ^2.3.0
  adafruit/Adafruit BMP280 Library @ ^2.6.8
  adafruit/Adafruit SHTC3 Library @ ^1.0.1
  sensirion/Sensirion I2C SHT4x @ ^1.1.2
  arduino-libraries/Arduino_LPS22HB @ ^1.0.2
  adafruit/Adafruit MLX90614 Library @ ^2.1.5
  adafruit/Adafruit_VL53L0X @ ^1.2.4
  stevemarple/MicroNMEA @ ^2.0.6
  adafruit/Adafruit BME680 Library @ ^2.0.4
  adafruit/Adafruit BMP085 Library @ ^1.2.4

; ----------------- TESTING ---------------------

[env:native]
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I src
  -I test/mocks
test_build_src = yes
test_ignore =
  test_kiss_modem
  test_core_tuning
  test_chat_group_msg
  test_identity_store
  test_node_prefs
  test_radio_wrappers
  test_radio_chips
  test_radio_chips_init
  test_server_base
  test_sensor_role
  test_repeater_role
  test_region_map
  test_variant_target
  test_variant_target_override
  test_variant_target_globals
  test_companion_frames
build_src_filter =
  -<*>
  +<../src/Utils.cpp>
  +<../src/Packet.cpp>
  +<../src/helpers/ConfigSerializer.cpp>
  +<../src/helpers/DynamicConfigSerializer.cpp>
  +<../src/helpers/CommonRadioPrefs.cpp>
  +<../src/helpers/TxtDataHelpers.cpp>
lib_deps =
  google/googletest @ 1.17.0

[env:native_ofast]
; the prefs tests again with -Ofast, the optimisation nRF52 builds use
; (it includes -ffast-math, under which float comparisons may assume no NaN)
platform = native
test_framework = googletest
build_flags = ${env:native.build_flags}
  -Ofast
test_build_src = yes
test_filter =
  test_common_node_prefs
  test_companion_node_prefs
build_src_filter = ${env:native.build_src_filter}
lib_deps =
  google/googletest @ 1.17.0

[env:native_server]
; The server roles on the host: the real role implementation against the mocks in
; test/mocks, so the shared underpinnings can be characterized before they move.
; RP2040_PLATFORM selects the plain string file modes of the helpers, which the
; in-memory file system mock implements. One role per environment: the repeater and
; the room server both define `MyMesh`.
platform = native
test_framework = googletest
build_flags = -std=c++17
  -D RP2040_PLATFORM
  -I src
  -I test/mocks
  -I examples/simple_room_server
test_build_src = yes
test_filter = test_server_base
build_src_filter =
  -<*>
  +<../src/Utils.cpp>
  +<../src/Packet.cpp>
  +<../src/Dispatcher.cpp>
  +<../src/Mesh.cpp>
  +<../src/helpers/AdvertDataHelpers.cpp>
  +<../src/helpers/ClientACL.cpp>
  +<../src/helpers/CommonCLI.cpp>
  +<../src/helpers/CommonRadioPrefs.cpp>
  +<../src/helpers/ConfigSerializer.cpp>
  +<../src/helpers/DynamicConfigSerializer.cpp>
  +<../src/helpers/IdentityStore.cpp>
  +<../src/helpers/RegionMap.cpp>
  +<../src/helpers/ServerMesh.cpp>
  +<../src/helpers/StaticPoolPacketManager.cpp>
  +<../src/helpers/TransportKeyStore.cpp>
  +<../src/helpers/TxtDataHelpers.cpp>
  +<../examples/simple_room_server/MyMesh.cpp>
lib_deps =
  google/googletest @ 1.17.0

[env:native_sensor]
; The sensor role on the host, in its own environment: each role needs a separate
; binary, and the sensor is the one whose behaviour differs from the other two.
platform = native
test_framework = googletest
build_flags = -std=c++17
  -D RP2040_PLATFORM
  -I src
  -I test/mocks
  -I examples/simple_sensor
test_build_src = yes
test_filter = test_sensor_role
build_src_filter =
  -<*>
  +<../src/Utils.cpp>
  +<../src/Packet.cpp>
  +<../src/Dispatcher.cpp>
  +<../src/Mesh.cpp>
  +<../src/helpers/AdvertDataHelpers.cpp>
  +<../src/helpers/ClientACL.cpp>
  +<../src/helpers/CommonCLI.cpp>
  +<../src/helpers/CommonRadioPrefs.cpp>
  +<../src/helpers/ConfigSerializer.cpp>
  +<../src/helpers/DynamicConfigSerializer.cpp>
  +<../src/helpers/IdentityStore.cpp>
  +<../src/helpers/RegionMap.cpp>
  +<../src/helpers/ServerMesh.cpp>
  +<../src/helpers/StaticPoolPacketManager.cpp>
  +<../src/helpers/TransportKeyStore.cpp>
  +<../src/helpers/TxtDataHelpers.cpp>
  +<../examples/simple_sensor/SensorMesh.cpp>
  +<../examples/simple_sensor/TimeSeriesData.cpp>
lib_deps =
  google/googletest @ 1.17.0

[env:native_repeater]
; The repeater on the host, in its own environment: the repeater and the room server
; both define `MyMesh`, so each needs a binary of its own. Built the way most
; firmware is, with none of the optional blocks that begin() contains.
platform = native
test_framework = googletest
build_flags = -std=c++17
  -D RP2040_PLATFORM
  -I src
  -I test/mocks
  -I examples/simple_repeater
test_build_src = yes
test_filter = test_repeater_role
build_src_filter =
  -<*>
  +<../src/Utils.cpp>
  +<../src/Packet.cpp>
  +<../src/Dispatcher.cpp>
  +<../src/Mesh.cpp>
  +<../src/helpers/AdvertDataHelpers.cpp>
  +<../src/helpers/ClientACL.cpp>
  +<../src/helpers/CommonCLI.cpp>
  +<../src/helpers/CommonRadioPrefs.cpp>
  +<../src/helpers/ConfigSerializer.cpp>
  +<../src/helpers/DynamicConfigSerializer.cpp>
  +<../src/helpers/IdentityStore.cpp>
  +<../src/helpers/RegionMap.cpp>
  +<../src/helpers/ServerMesh.cpp>
  +<../src/helpers/StaticPoolPacketManager.cpp>
  +<../src/helpers/TransportKeyStore.cpp>
  +<../src/helpers/TxtDataHelpers.cpp>
  +<../examples/simple_repeater/MyMesh.cpp>
lib_deps =
  google/googletest @ 1.17.0

[env:native_repeater_full]
; The same repeater with every optional block of begin() compiled in: a bridge (the
; stand-in in test/mocks/bridge, which has to come ahead of src on the include
; path), the GPS toggle, a configured default flood scope, and the debug log (which
; the Arduino core only compiles in when ARDUINO is set). Runs the same suite.
platform = native
test_framework = googletest
build_flags = -std=c++17
  -D RP2040_PLATFORM
  -I test/mocks/bridge
  -I src
  -I test/mocks
  -I examples/simple_repeater
  -D WITH_RS232_BRIDGE=0
  -D ENV_INCLUDE_GPS=1
  -D DEFAULT_FLOOD_SCOPE_NAME='"scope-test"'
  -D MESH_DEBUG=1
  -D ARDUINO=1
test_build_src = yes
test_filter = test_repeater_role
build_src_filter = ${env:native_repeater.build_src_filter}
lib_deps =
  google/googletest @ 1.17.0

[env:native_companion]
; The companion on the host: the real MyMesh.cpp and DataStore.cpp against the mocks in
; test/mocks, so the frame protocol (handleCmdFrame) can be characterized before it
; is restructured (docs/refactoring/0010-companion-command-table.md). RP2040_PLATFORM
; selects the plain string file modes of the data store, which the in-memory file
; system mock implements. Private key export and import are compiled in, so both
; sides of those two branches are reachable.
platform = native
test_framework = googletest
build_flags = -std=c++17
  -D RP2040_PLATFORM
  ; the frame reader counts reads that ran out, for test_frame_bounds.cpp
  -D FRAME_READER_COUNT_OVERRUNS
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D MAX_LORA_TX_POWER=22
  -D MAX_GROUP_CHANNELS=8
  ; set for the whole build, as every companion env does: BaseChatMesh.h sizes its
  ; contact table from it, and a default in one file only would give two layouts
  -D MAX_CONTACTS=100
  -I src
  -I test/mocks
  -I examples/companion_radio
  ; the chat layer decodes channel secrets with this header-only library (lib_deps
  ; below); the dependency finder does not scan sources pulled in from outside src_dir
  -I ${platformio.libdeps_dir}/${this.__env__}/base64/src
test_build_src = yes
test_filter = test_companion_frames
build_src_filter =
  -<*>
  +<../src/Utils.cpp>
  +<../src/Packet.cpp>
  +<../src/Dispatcher.cpp>
  +<../src/Mesh.cpp>
  +<../src/helpers/AdvertDataHelpers.cpp>
  +<../src/helpers/BaseChatMesh.cpp>
  +<../src/helpers/CommonRadioPrefs.cpp>
  +<../src/helpers/ConfigSerializer.cpp>
  +<../src/helpers/DynamicConfigSerializer.cpp>
  +<../src/helpers/IdentityStore.cpp>
  +<../src/helpers/StaticPoolPacketManager.cpp>
  +<../src/helpers/TransportKeyStore.cpp>
  +<../src/helpers/TxtDataHelpers.cpp>
  +<../examples/companion_radio/DataStore.cpp>
  +<../examples/companion_radio/MyMesh.cpp>
lib_deps =
  google/googletest @ 1.17.0
  densaugeo/base64 @ ~1.4.0

[env:native_core]
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I src
  -I test/mocks
test_build_src = yes
test_filter = test_core_tuning
build_src_filter =
  -<*>
  +<../src/Utils.cpp>
  +<../src/Packet.cpp>
  +<../src/Dispatcher.cpp>
  +<../src/Mesh.cpp>
lib_deps =
  google/googletest @ 1.17.0

[env:native_chat]
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I src
  -I test/mocks
test_build_src = yes
test_filter = test_chat_group_msg
build_src_filter =
  -<*>
  +<../src/Utils.cpp>
  +<../src/Packet.cpp>
  +<../src/Dispatcher.cpp>
  +<../src/Mesh.cpp>
  +<../src/helpers/BaseChatMesh.cpp>
  +<../src/helpers/AdvertDataHelpers.cpp>
  +<../src/helpers/TxtDataHelpers.cpp>
lib_deps =
  google/googletest @ 1.17.0

[env:native_identity_store]
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I test/mocks
  -I src
  -D NRF52_PLATFORM
test_build_src = yes
test_filter = test_identity_store
build_src_filter =
  -<*>
  +<../src/helpers/IdentityStore.cpp>
lib_deps =
  google/googletest @ 1.17.0

[env:native_node_prefs]
; NodePrefs lives in CommonCLI.h, whose filesystem types only exist for a
; platform, so this environment picks the nRF52 branch and uses the mock
; filesystem for the types.
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I src
  -I test/mocks
  -D NRF52_PLATFORM
test_build_src = yes
test_filter = test_node_prefs
build_src_filter =
  -<*>
  +<../src/Utils.cpp>
  +<../src/Packet.cpp>
  +<../src/helpers/ConfigSerializer.cpp>
  +<../src/helpers/DynamicConfigSerializer.cpp>
  +<../src/helpers/CommonRadioPrefs.cpp>
  +<../src/helpers/TxtDataHelpers.cpp>
lib_deps =
  google/googletest @ 1.17.0

[env:native_radio_wrappers]
; The real RadioLibWrapper against a minimal RadioLib stand-in, so the packet
; score can be checked on the host. LORA_SF is deliberately not 10, so a score
; that silently assumes sf=10 shows up as a failure.
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I src
  -I test/mocks
  -D LORA_SF=9
test_build_src = yes
test_filter = test_radio_wrappers
build_src_filter =
  -<*>
  +<../src/helpers/radiolib/RadioLibWrappers.cpp>
lib_deps =
  google/googletest @ 1.17.0

[env:native_variant_target]
; What a board variant's target.cpp gives the roles, on the host: the real
; RadioLibWrapper and RadioNoiseListener against the RadioLib stand-in, and the
; shared definitions in RadioLibTarget.cpp against the target.h of a RadioLib
; variant (test/mocks/radiolib_variant, ahead of test/mocks). LORA_SF,
; WRAPPER_CLASS and RADIO_CLASS are what every RadioLib variant's build flags
; set, NRF52_PLATFORM what every nRF52 one sets (the default radio_init() is
; only built there); the LORA_SF value does not matter here.
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I test/mocks/radiolib_variant
  -I src
  -I test/mocks
  -D LORA_SF=8
  -D WRAPPER_CLASS=TestRadioWrapper
  -D RADIO_CLASS=TestRadio
  -D NRF52_PLATFORM
test_build_src = yes
test_filter = test_variant_target
build_src_filter =
  -<*>
  +<../src/helpers/radiolib/RadioLibWrappers.cpp>
  +<../src/helpers/radiolib/RadioLibTarget.cpp>
lib_deps =
  google/googletest @ 1.17.0

[env:native_variant_target_override]
; The same, with a test that defines its own radio_new_identity(), as a variant
; that keeps its copy does. One binary per case, since the definition is global.
platform = native
test_framework = googletest
build_flags = ${env:native_variant_target.build_flags}
test_build_src = yes
test_filter = test_variant_target_override
build_src_filter = ${env:native_variant_target.build_src_filter}
lib_deps =
  google/googletest @ 1.17.0

[env:native_variant_target_globals]
; The radio, wrapper and RTC globals of a RadioLib variant (cut D of note 0011):
; the shared code against the target.h of a variant with the real
; AutoDiscoverRTCClock (test/mocks/radiolib_variant_globals, ahead of the other
; stand-ins). The pins and NRF52_PLATFORM are what an nRF52 variant's build
; flags and variant.h set; their values only have to differ from each other.
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I test/mocks/radiolib_variant_globals
  -I test/mocks/radiolib_variant
  -I src
  -I test/mocks
  -D LORA_SF=8
  -D WRAPPER_CLASS=TestRadioWrapper
  -D RADIO_CLASS=TestRadio
  -D NRF52_PLATFORM
  -D P_LORA_NSS=11
  -D P_LORA_DIO_1=12
  -D P_LORA_RESET=13
  -D P_LORA_BUSY=14
test_build_src = yes
test_filter = test_variant_target_globals
build_src_filter = ${env:native_variant_target.build_src_filter}
lib_deps =
  google/googletest @ 1.17.0

[env:native_region]
; RegionMap on the host. It reads packets and keys and writes nothing but its own
; table, so it builds against the small stubs in test/test_region_map/stubs, which are
; listed first so they take the place of the shared mocks for this suite only.
; RP2040_PLATFORM selects the Arduino FS.h file system type that RegionMap names.
platform = native
test_framework = googletest
build_flags = -std=c++17
  -D RP2040_PLATFORM
  -I test/test_region_map/stubs
  -I src
  -I test/mocks
test_build_src = yes
test_filter = test_region_map
build_src_filter =
  -<*>
  +<../src/Packet.cpp>
  +<../src/helpers/RegionMap.cpp>
  +<../src/helpers/TransportKeyStore.cpp>
  +<../src/helpers/TxtDataHelpers.cpp>
lib_deps =
  google/googletest @ 1.17.0

[env:native_kiss_modem]
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I test/mocks
  -I src
  -I examples/kiss_modem
test_build_src = yes
test_filter = test_kiss_modem
build_src_filter =
  -<*>
  +<../examples/kiss_modem/KissModem.cpp>
lib_deps =
  google/googletest @ 1.17.0

[env:native_radio_chips]
; The real chip classes in src/helpers/radiolib against a host stand-in for the
; RadioLib chip classes (test/test_radio_chips/stubs, listed first so it takes the
; place of the PhysicalLayer mock), so their receive detection can be checked on
; the host.
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I test/test_radio_chips/stubs
  -I src
  -I test/mocks
  -D LORA_FREQ=869.525
  -D LORA_BW=250
  -D LORA_SF=11
  -D LORA_TX_POWER=22
  -D LR2021_IRQ_DIO=8
test_build_src = yes
test_filter =
  test_radio_chips
  test_radio_chips_init
build_src_filter =
  -<*>
lib_deps =
  google/googletest @ 1.17.0
